<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>my recipes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;--ivory:#faf4e4;--card:#fffdf7;--sage:#a9b79c;--sage-d:#66795c;--wine:#6b1f2f;--ink:#33241f;--soft:#7a6b62;--line:#e4dcc9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--wine);outline-offset:4px;border-radius:8px}
h1,h2{font-family:"Young Serif",Georgia,serif;font-weight:400;line-height:1.1;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px 72px}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font-family:"Young Serif",Georgia,serif;font-size:22px;color:var(--wine)}
.back{color:var(--sage-d);font-weight:600}
.hero{background:var(--sage);border-radius:28px;padding:44px 40px;margin-bottom:48px;color:#2a3324}
.hero h1{font-size:clamp(36px,6vw,60px);color:#4d1523}
.hero p{margin:14px 0 0;max-width:46ch;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:44px 28px}
.card{display:block;text-align:center}
.pic{width:100%;max-width:240px;aspect-ratio:1;border-radius:50%;margin:0 auto;border:5px solid var(--card);box-shadow:0 0 0 2px var(--sage);background:var(--sage) center/cover;display:grid;place-items:center;transition:box-shadow .2s}
.card:hover .pic{box-shadow:0 0 0 4px var(--wine)}
.pic.empty{background:repeating-linear-gradient(45deg,var(--card),var(--card) 10px,var(--ivory) 10px,var(--ivory) 20px);color:var(--soft);font-size:14px}
.card h2{font-size:23px;margin-top:20px}
.card small{color:var(--soft);display:block;margin-top:4px}
.rhead{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:48px;align-items:center;margin:8px 0 56px}
.rhead .pic{max-width:320px}
.rhead h1{font-size:clamp(38px,6vw,64px);color:var(--wine)}
.rhead p{color:var(--soft);margin:14px 0 0}
h2.sec{font-size:30px;margin-bottom:22px;color:var(--sage-d)}
.ings{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px;margin-bottom:56px}
.ing{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px 12px;text-align:center;font-size:15px;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:8px}
.ing img,.ing i{width:56px;height:56px;object-fit:contain}
.ing i{border-radius:50%;background:var(--sage);color:#2a3324;font:normal 600 22px/56px "Young Serif",serif}
.opt{color:var(--soft);font-size:13px;font-style:italic}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;max-width:680px}
ol.steps>li{counter-increment:s;position:relative;padding:0 0 22px 56px}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:0;width:38px;height:38px;border-radius:50%;background:var(--wine);color:var(--ivory);display:grid;place-items:center;font:600 16px/1 Figtree,sans-serif}
.tag{font-size:12px;font-weight:600;color:var(--sage-d);border:1px solid var(--sage);border-radius:99px;padding:1px 9px;margin-right:6px}
.warn{background:var(--wine);color:var(--ivory);padding:10px 16px;border-radius:14px;font-weight:600}
ol.sub{margin:8px 0 0;padding-left:20px;color:var(--soft)}
@media (max-width:700px){.rhead{grid-template-columns:1fr;gap:28px;text-align:center}.hero{padding:32px 24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap" id="app"></div>

{id:'overnight-oats',t:'tres leches overnight oats',m:'Creamy, strawberry-topped, ready when you wake up',g:['quick cook oats|oats','chia seeds|chia_seeds','greek yogurt|greek_yogurt','condensed milk|sweet_condensed_milk','strawberries|strawberries','vanilla extract / bean paste|vanilla_extract','~cinnamon|cinnamon'],
s:['place 1/2 cup oats & 2 tbsp of chia seeds in a jar','mix in 1/2 cup of greek yogurt and 1/4 cup of water','fold in 1 - 2 tsp of condensed milk & 1 tsp of vanilla','make sure everything is mixed really well or it’ll be dry','leave covered overnight','top with diced strawberries!']},

const pic=(r,c='')=>r.p?`<div class="pic ${c}" role="img" aria-label="${r.t}" style="background-image:url(${P[r.p]})"></div>`:`<div class="pic empty ${c}"><span>photo coming soon</span></div>`;
const ing=x=>{let o=x[0]=='~';if(o)x=x.slice(1);const[l,k]=x.split('|');return `<div class="ing">${I[k]?`<img src="${I[k]}" alt="">`:`<i>${l[0]}</i>`}<span>${l}</span>${o?'<span class="opt">optional</span>':''}</div>`};
const step=s=>{if(Array.isArray(s))return `<li>${s[0]}<ol class="sub" type="a">${s[1].map(y=>`<li>${y}</li>`).join('')}</ol></li>`;
 if(s[0]=='!')return `<li><div class="warn">${s.slice(1)}</div></li>`;
 if(s[0]=='~')return `<li><span class="tag">optional</span>${s.slice(1)}</li>`;return `<li>${s}</li>`};
function home(){return `<div class="top"><span class="logo">my recipes</span></div>
<section class="hero"><h1>what’s cooking?</h1></section>
<div class="grid">${R.map(r=>`<a class="card" href="#/${r.id}">${pic(r)}<h2>${r.t}</h2><small>${r.g.length} ingredients</small></a>`).join('')}</div>`}
function page(r){return `<div class="top"><a class="back" href="#/">← all recipes</a><span class="logo">my recipes</span></div>
<header class="rhead">${pic(r)}<div><h1>${r.t}</h1></div></header>
<h2 class="sec">ingredients</h2><div class="ings">${r.g.map(ing).join('')}</div>
<h2 class="sec">steps</h2><ol class="steps">${r.s.map(step).join('')}</ol>`}
function route(){const id=location.hash.slice(2),r=R.find(x=>x.id==id);document.getElementById('app').innerHTML=r?page(r):home();document.title=r?r.t+' · my recipes':'my recipes';scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script></body></html>
